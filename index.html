<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PortionPilot — cook the right amount, every time. Save recipes, scale servings, and generate shopping lists.">
  <meta name="theme-color" content="#166534">
  <title>PortionPilot — Recipe Scaling Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img class="brand-icon" src="assets/icon.svg" alt="" width="36" height="36">
        <div class="brand-text">
          <p class="brand-name">PortionPilot</p>
          <p class="brand-tag">Cook the right amount</p>
        </div>
      </div>
      <nav id="sidebar-nav" aria-label="Sections"></nav>
      <p class="sidebar-note">Your recipes stay on this device. No accounts, no tracking.</p>
    </aside>
    <main class="main">
      <div id="view" class="view"></div>
    </main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Sections"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
